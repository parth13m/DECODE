name: Decode
options:
  bundleIdPrefix: com.decode
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: P5Y864DV5S
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
      CLANG_ENABLE_CODE_COVERAGE: NO
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_HARDENED_RUNTIME: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    version: 7.5.0
  SwiftSyntax:
    url: https://github.com/swiftlang/swift-syntax
    version: 600.0.1
  SwiftTreeSitter:
    url: https://github.com/ChimeHQ/SwiftTreeSitter
    from: "0.10.0"
  TreeSitterPython:
    url: https://github.com/tree-sitter/tree-sitter-python
    version: 0.23.6
  TreeSitterJavaScript:
    url: https://github.com/tree-sitter/tree-sitter-javascript
    version: 0.23.1
  TreeSitterTypeScript:
    url: https://github.com/tree-sitter/tree-sitter-typescript
    version: 0.23.2
  TreeSitterHTML:
    url: https://github.com/tree-sitter/tree-sitter-html
    version: 0.23.2
  TreeSitterCSS:
    url: https://github.com/tree-sitter/tree-sitter-css
    version: 0.23.2
  # TreeSitterSQL temporarily excluded — DerekStride/tree-sitter-sql has a
  # broken test-target dependency name that prevents SPM resolution.
  # Re-add once upstream fixes Package.swift or we fork.
  # TreeSitterSQL:
  #   url: https://github.com/DerekStride/tree-sitter-sql
  #   version: 0.3.7
  TreeSitterJava:
    url: https://github.com/tree-sitter/tree-sitter-java
    version: 0.23.5
  TreeSitterCSharp:
    url: https://github.com/tree-sitter/tree-sitter-c-sharp
    version: 0.23.1
  TreeSitterC:
    url: https://github.com/tree-sitter/tree-sitter-c
    version: 0.23.4
  TreeSitterCPP:
    url: https://github.com/tree-sitter/tree-sitter-cpp
    version: 0.23.4

targets:

  # ─────────────────────────────────────────────────────────────
  # Understanding Pipeline — 8 Framework Targets (IAG-001 §1)
  # ─────────────────────────────────────────────────────────────

  # M1: Foundation types and cross-module protocols
  DIRCore:
    type: framework
    platform: macOS
    sources:
      - path: Decode/Understanding/DIRCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.dircore
        GENERATE_INFOPLIST_FILE: YES
    dependencies: []

  # M2: DAG-ordered pass execution (DDS-001, DDS-003)
  ProducerRuntime:
    type: framework
    platform: macOS
    sources:
      - path: Decode/Understanding/ProducerRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.producerruntime
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DIRCore
      - package: SwiftSyntax
        product: SwiftSyntax
      - package: SwiftSyntax
        product: SwiftParser
      - package: SwiftTreeSitter
        product: SwiftTreeSitter
      - package: TreeSitterPython
      - package: TreeSitterJavaScript
      - package: TreeSitterTypeScript
        product: TreeSitterTypeScript
      - package: TreeSitterHTML
      - package: TreeSitterCSS
      - package: TreeSitterJava
      - package: TreeSitterCSharp
      - package: TreeSitterC
      - package: TreeSitterCPP

  # M3: Five index families, incremental maintenance (DDS-004)
  IndexRuntime:
    type: framework
    platform: macOS
    sources:
      - path: Decode/Understanding/IndexRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.indexruntime
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DIRCore

  # M4: Evidence retrieval from indexes and DIR (DDS-005)
  RetrievalRuntime:
    type: framework
    platform: macOS
    sources:
      - path: Decode/Understanding/RetrievalRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.retrievalruntime
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DIRCore
      - target: IndexRuntime

  # M5: Structured context from retrieved evidence (DDS-006)
  ContextAssembly:
    type: framework
    platform: macOS
    sources:
      - path: Decode/Understanding/ContextAssembly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.contextassembly
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DIRCore
      - target: RetrievalRuntime

  # M6: Understanding delivery to consumers (DDS-009)
  ConsumerRuntime:
    type: framework
    platform: macOS
    sources:
      - path: Decode/Understanding/ConsumerRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.consumerruntime
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DIRCore
      - target: ContextAssembly

  # M7: Synchronous/deferred pipeline orchestration, DIR ownership (DDS-007)
  UpdateEngine:
    type: framework
    platform: macOS
    sources:
      - path: Decode/Understanding/UpdateEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.updateengine
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DIRCore
      - target: ProducerRuntime
      - target: IndexRuntime
      - target: StorageEngine

  # M8: Snapshot persistence, GC, grounding map, content hashes (DDS-008)
  StorageEngine:
    type: framework
    platform: macOS
    sources:
      - path: Decode/Understanding/StorageEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.storageengine
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DIRCore

  # ─────────────────────────────────────────────────────────────
  # Understanding Pipeline — Test Support (IAG-001 §9)
  # ─────────────────────────────────────────────────────────────

  UnderstandingTestSupport:
    type: framework
    platform: macOS
    sources:
      - path: UnderstandingTests/UnderstandingTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.understandingtestsupport
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DIRCore

  # ─────────────────────────────────────────────────────────────
  # Understanding Pipeline — 8 Unit Test Targets (IAG-001 §8)
  # ─────────────────────────────────────────────────────────────

  DIRCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UnderstandingTests/DIRCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.dircoretests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DIRCore
      - target: UnderstandingTestSupport

  ProducerRuntimeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UnderstandingTests/ProducerRuntimeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.producerruntimetests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ProducerRuntime
      - target: DIRCore
      - target: UnderstandingTestSupport

  IndexRuntimeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UnderstandingTests/IndexRuntimeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.indexruntimetests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: IndexRuntime
      - target: DIRCore
      - target: UnderstandingTestSupport

  RetrievalRuntimeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UnderstandingTests/RetrievalRuntimeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.retrievalruntimetests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: RetrievalRuntime
      - target: IndexRuntime
      - target: DIRCore
      - target: UnderstandingTestSupport

  ContextAssemblyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UnderstandingTests/ContextAssemblyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.contextassemblytests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ContextAssembly
      - target: RetrievalRuntime
      - target: DIRCore
      - target: UnderstandingTestSupport

  ConsumerRuntimeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UnderstandingTests/ConsumerRuntimeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.consumerruntimetests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ConsumerRuntime
      - target: ContextAssembly
      - target: RetrievalRuntime
      - target: DIRCore
      - target: UnderstandingTestSupport

  UpdateEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UnderstandingTests/UpdateEngineTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.updateenginetests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: UpdateEngine
      - target: DIRCore
      - target: UnderstandingTestSupport

  StorageEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UnderstandingTests/StorageEngineTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.storageenginetests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: StorageEngine
      - target: DIRCore
      - target: UnderstandingTestSupport

  # ─────────────────────────────────────────────────────────────
  # Understanding Pipeline — 1 Integration Test Target (IAG-001 §8)
  # ─────────────────────────────────────────────────────────────

  UnderstandingIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UnderstandingTests/UnderstandingIntegrationTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.understandingintegrationtests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DIRCore
      - target: ProducerRuntime
      - target: IndexRuntime
      - target: RetrievalRuntime
      - target: ContextAssembly
      - target: ConsumerRuntime
      - target: UpdateEngine
      - target: StorageEngine
      - target: UnderstandingTestSupport

  # ─────────────────────────────────────────────────────────────
  # Decode Application
  # ─────────────────────────────────────────────────────────────

  Decode:
    type: application
    platform: macOS
    sources:
      - path: Decode
        excludes:
          - "Infrastructure/AST/Queries/**"
          - "Understanding/**"
      - path: Decode/Infrastructure/AST/Queries
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.app
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: Decode
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_ENTITLEMENTS: Decode/App/Decode.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GRDB
      - package: SwiftSyntax
        product: SwiftSyntax
      - package: SwiftSyntax
        product: SwiftParser
      - package: SwiftTreeSitter
        product: SwiftTreeSitter
      - package: TreeSitterPython
      - package: TreeSitterJavaScript
      - package: TreeSitterTypeScript
        product: TreeSitterTypeScript
      - package: TreeSitterHTML
      - package: TreeSitterCSS
      # - package: TreeSitterSQL  # temporarily excluded (broken upstream Package.swift)
      - package: TreeSitterJava
      - package: TreeSitterCSharp
      - package: TreeSitterC
      - package: TreeSitterCPP
      # Understanding pipeline framework targets (Phase 6: Application Integration)
      - target: DIRCore
      - target: ProducerRuntime
      - target: IndexRuntime
      - target: RetrievalRuntime
      - target: ContextAssembly
      - target: ConsumerRuntime
      - target: UpdateEngine
      - target: StorageEngine

  DecodeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DecodeTests
    dependencies:
      - target: Decode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.tests
        GENERATE_INFOPLIST_FILE: YES

  DecodeIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DecodeIntegrationTests
    dependencies:
      - target: Decode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.integrationtests
        GENERATE_INFOPLIST_FILE: YES

  DecodeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: DecodeUITests
    dependencies:
      - target: Decode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decode.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Decode:
    build:
      targets:
        Decode: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DecodeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
